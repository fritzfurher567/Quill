
name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check npm registry
        run: npm config set registry https://registry.npmjs.org/

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          for attempt in 1 2 3; do
            echo "Dependency installation attempt $attempt of 3"

            if [ -f package-lock.json ]; then
              if npm ci --prefer-online --no-audit --no-fund; then
                exit 0
              fi
            else
              if npm install --prefer-online --no-audit --no-fund; then
                exit 0
              fi
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Installation failed. Clearing npm cache before retry."
              npm cache clean --force
              sleep 5
            fi
          done

          echo "Dependency installation failed after 3 attempts."
          exit 1

      - name: Build installer
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            npm run package:win
          elif [ "$RUNNER_OS" = "macOS" ]; then
            npm run package:mac
          elif [ "$RUNNER_OS" = "Linux" ]; then
            npm run package:linux
          else
            echo "Unsupported operating system: $RUNNER_OS"
            exit 1
          fi
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: quill-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

